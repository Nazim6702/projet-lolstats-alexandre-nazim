<div class="app-shell">
  <header class="app-header">
    <div class="app-container d-flex align-items-center justify-content-between">
      <a class="brand" routerLink="/accueil">
        <span class="brand-mark"><span class="brand-text">LS</span></span>
        <span class="brand-name">lolStats</span>
      </a>

      <nav class="nav-links">
        <a
          class="nav-link"
          routerLink="/accueil"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Accueil
        </a>
        <a class="nav-link" routerLink="/champions" routerLinkActive="active">
          Champions
        </a>
        <a class="nav-link" routerLink="/classement" routerLinkActive="active">
          Classement
        </a>
      </nav>
    </div>
  </header>

  @if (backendStatus !== 'ok') {
    <div class="backend-banner">
      <div class="app-container backend-banner-inner">
        <div class="backend-banner-text">
          <strong>Backend requis</strong>
          @if (backendStatus === 'checking') {
            <span>Vérification de la connexion au backend en cours…</span>
          } @else {
            <span>Le backend ne répond pas. Lance `backend` avec une clé Riot valide.</span>
          }
        </div>
        <button
          class="backend-banner-btn"
          type="button"
          (click)="checkBackend()"
          [disabled]="checkingBackend"
        >
          @if (checkingBackend) { Vérification… } @else { Réessayer }
        </button>
      </div>
    </div>
  }

  <main class="app-main">
    <div class="app-container">
      <router-outlet></router-outlet>
    </div>
  </main>

  <a class="about-fab" routerLink="/a-propos" aria-label="À propos">
    i
  </a>
</div>
