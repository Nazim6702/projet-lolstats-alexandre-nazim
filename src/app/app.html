<div class="app-shell">
  <header class="app-header">
    <div class="app-container d-flex align-items-center justify-content-between">
      <a class="brand" routerLink="/accueil">
        <span class="brand-mark"><span class="brand-text">LS</span></span>
        <span class="brand-name">lolStats</span>
      </a>

      <nav class="nav-links">
        <a
          class="nav-link"
          routerLink="/accueil"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Accueil
        </a>
        <a class="nav-link" routerLink="/champions" routerLinkActive="active">
          Champions
        </a>
        <a class="nav-link" routerLink="/classement" routerLinkActive="active">
          Classement
        </a>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <div class="app-container">
      <router-outlet></router-outlet>
    </div>
  </main>

  <a class="about-fab" routerLink="/a-propos" aria-label="À propos">
    i
  </a>
</div>
