<div class="not-found glass">
  <div class="code">404</div>
  <div>
    <h1 class="mb-2">Page introuvable</h1>
    <p class="subtitle mb-4">
      La page que tu cherches n'existe pas (ou a ete deplacee).
    </p>

    <div class="actions">
      @for (s of suggestions; track s.link) {
        <a class="action-btn" [routerLink]="s.link">
          {{ s.label }}
        </a>
      }
    </div>
  </div>
</div>
