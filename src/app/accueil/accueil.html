<section class="hero glass">
  <div class="hero-text">
    <span class="pill">Live Riot data</span>
    <h1 class="hero-title">
      Recherche ton joueur <span class="glow-text">LoL</span>.
    </h1>
    <p class="hero-subtitle">
      Recherche un joueur par Riot ID et affiche ses stats et champions preferes.
    </p>
  </div>

  <form class="hero-form" (ngSubmit)="search()" #f="ngForm" novalidate>
    <div class="field">
      <label class="field-label" for="gameName">Pseudo</label>
      <input
        id="gameName"
        type="text"
        class="field-input"
        name="gameName"
        [(ngModel)]="gameName"
        required
        autocomplete="off"
        placeholder="ex: Sumish"
      />
    </div>

    <div class="field">
      <label class="field-label" for="tagLine">Tag</label>
      <input
        id="tagLine"
        type="text"
        class="field-input"
        name="tagLine"
        [(ngModel)]="tagLine"
        required
        autocomplete="off"
        placeholder="ex: QLF"
      />
    </div>

    <button class="cta-btn" type="submit" [disabled]="f.invalid || loading">
      @if (loading) { Recherche... } @else { Scanner le joueur }
    </button>
  </form>
</section>

@if (error) {
  <div class="alert alert-danger mt-3 mb-0">{{ error }}</div>
}
